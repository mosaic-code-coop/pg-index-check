name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17', '18']

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5434/test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      # GitHub Actions `services:` cannot pass server flags, and pg_stat_statements
      # must be in shared_preload_libraries, so start Postgres with docker compose.
      - name: Start PostgreSQL ${{ matrix.postgres }}
        run: docker compose up -d --wait postgres-test
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}

      - name: Run integration tests
        run: npm run test:integration
